name: Windows emulation

on:
  push:
  pull_request:

jobs:
  emulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y handbrake-cli ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit --pretty false

  panel-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the arm64 panel image
        run: |
          image="ghcr.io/zalupa-ronaldo/sklad-torrents"
          tags=(-t "${image}:${{ github.sha }}" -t "${image}:sha-${{ github.sha }}")
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            tags+=(-t "${image}:main")
          fi
          docker buildx build --platform linux/arm64 --push "${tags[@]}" .
